{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <div class="post-meta">
    {{ if not .Date.IsZero }}<span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span>{{ end }}
    {{ with .GetTerms "tags" }}
      <span class="post-tags">{{ range . }}<a href="{{ .Permalink }}">{{ .LinkTitle }}</a>{{ end }}</span>
    {{ end }}
  </div>
  {{ .Content }}
{{ end }}
