{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ if not .Date.IsZero }}
    <p class="post-date">{{ .Date.Format "Jan 2, 2006" }}</p>
  {{ end }}
  {{ with .Params.tags }}
    <p>Tags:
    {{ range . }}
      <a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}/">{{ . }}</a>
    {{ end }}
    </p>
  {{ end }}
  {{ .Content }}
{{ end }}
